# Production stack for the VPS. Secrets come from .env (never committed).
# Traefik already runs on the host (network `root_default`) and terminates HTTPS.
name: polytrader

x-app: &app
  image: polytrader:latest
  env_file: .env
  restart: unless-stopped
  networks: [internal]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # No `ports:` — the database is never reachable from outside Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    build: .
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    <<: *app
    command: ["npm", "run", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal, root_default]
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.services.polytrader.loadbalancer.server.port=3000
      - traefik.http.middlewares.polytrader-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.polytrader-headers.headers.stsIncludeSubdomains=true
      # Separate routers so each certificate is issued independently of the others' DNS.
      - traefik.http.routers.polytrader-main.rule=Host(`${APP_HOSTNAME}`) || Host(`www.${APP_HOSTNAME}`)
      - traefik.http.routers.polytrader-main.entrypoints=websecure
      - traefik.http.routers.polytrader-main.tls=true
      - traefik.http.routers.polytrader-main.tls.certresolver=mytlschallenge
      - traefik.http.routers.polytrader-main.middlewares=polytrader-headers@docker
      - traefik.http.routers.polytrader-main.service=polytrader
      - traefik.http.routers.polytrader-trade.rule=Host(`trade.${APP_HOSTNAME}`)
      - traefik.http.routers.polytrader-trade.entrypoints=websecure
      - traefik.http.routers.polytrader-trade.tls=true
      - traefik.http.routers.polytrader-trade.tls.certresolver=mytlschallenge
      - traefik.http.routers.polytrader-trade.middlewares=polytrader-headers@docker
      - traefik.http.routers.polytrader-trade.service=polytrader

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    stop_grace_period: 2m
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  # Ordinary bridge (not `internal: true`) so the worker can reach Polymarket and Anthropic.
  internal: {}
  root_default:
    external: true

volumes:
  pgdata: {}
